<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="description" content="Manage your job fair submission">
  <title>Employer Dashboard — NQU Job Fair</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>if(localStorage.getItem('nqu-dark')==='1')document.documentElement.setAttribute('data-theme','dark')</script>
  <style>
    .dash-grid { display: grid; grid-template-columns: 280px 1fr; gap: var(--space-6); align-items: start; }
    @media (max-width: 860px) { .dash-grid { grid-template-columns: 1fr; } }

    .info-card { background: var(--color-bg-alt); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-5); }
    .info-card + .info-card { margin-top: var(--space-4); }
    .info-card__title { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: var(--space-3); }
    .info-row { display: flex; gap: 10px; margin-bottom: var(--space-2); font-size: 0.875rem; }
    .info-row__icon { flex-shrink: 0; width: 20px; }
    .info-row__label { color: var(--text-muted); flex-shrink: 0; min-width: 80px; }
    .info-row__val { font-weight: 500; word-break: break-word; }

    .announce-strip { border-radius: var(--radius-md); padding: 10px 16px; margin-bottom: var(--space-4); display: flex; gap: 10px; align-items: flex-start; font-size: 0.875rem; }
    .announce-strip--pinned { background: #fef3c7; border-left: 4px solid #f59e0b; }
    .announce-strip--normal { background: var(--color-bg-alt); border-left: 4px solid var(--color-gold); }
    .announce-strip__title { font-weight: 700; margin-bottom: 2px; }

    .progress-bar { display: flex; align-items: center; gap: 0; margin: var(--space-4) 0; }
    .progress-step { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .progress-step__dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; border: 2px solid var(--color-border); background: var(--color-bg); color: var(--text-muted); transition: all 0.2s; z-index: 1; position: relative; }
    .progress-step__dot--done { background: #10b981; border-color: #10b981; color: #fff; }
    .progress-step__dot--active { background: var(--color-gold); border-color: var(--color-gold); color: #fff; }
    .progress-step__dot--rejected { background: var(--color-danger); border-color: var(--color-danger); color: #fff; }
    .progress-step__label { font-size: 0.7rem; color: var(--text-muted); margin-top: 5px; text-align: center; white-space: nowrap; }
    .progress-step__label--active { color: var(--color-gold); font-weight: 600; }
    .progress-step__label--rejected { color: var(--color-danger); font-weight: 600; }
    .progress-line { flex: 1; height: 2px; background: var(--color-border); margin: 0 -2px; margin-bottom: 22px; }
    .progress-line--done { background: #10b981; }

    .sub-card { background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
    .sub-card--approved { border-color: #10b981; }
    .sub-card--rejected { border-color: var(--color-danger); }
    .sub-card__header { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-5); border-bottom: 1px solid var(--color-border); background: var(--color-bg-alt); }
    .sub-card__logo { width: 64px; height: 64px; object-fit: contain; border-radius: var(--radius-md); border: 1px solid var(--color-border); background: #fff; flex-shrink: 0; }
    .sub-card__logo-placeholder { width: 64px; height: 64px; border-radius: var(--radius-md); border: 1px solid var(--color-border); background: var(--color-bg); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; flex-shrink: 0; }
    .sub-card__body { padding: var(--space-5); }
    .sub-card__fields { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3) var(--space-6); margin-bottom: var(--space-4); }
    @media (max-width: 540px) { .sub-card__fields { grid-template-columns: 1fr; } }
    .sub-field__label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.4px; color: var(--text-muted); margin-bottom: 2px; }
    .sub-field__val { font-size: 0.9rem; font-weight: 500; }
    .booth-banner { display: flex; align-items: center; gap: 12px; background: linear-gradient(135deg, #fef3c7, #fffbeb); border: 1px solid #f59e0b; border-radius: var(--radius-md); padding: 14px 18px; margin-bottom: var(--space-4); }
    .booth-banner__num { font-size: 1.8rem; font-weight: 800; color: var(--color-gold-dark); }
    .reject-banner { background: #fef2f2; border: 1px solid #fecaca; border-radius: var(--radius-md); padding: 14px 18px; margin-bottom: var(--space-4); }
    .reject-banner__title { font-weight: 700; color: var(--color-danger); margin-bottom: 4px; }
    .sub-card__actions { display: flex; gap: var(--space-2); flex-wrap: wrap; padding-top: var(--space-4); border-top: 1px solid var(--color-border); margin-top: var(--space-4); }

    .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
    @media (max-width: 540px) { .detail-grid { grid-template-columns: 1fr; } }
    .detail-section { margin-bottom: var(--space-5); }
    .detail-section__title { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: var(--space-2); padding-bottom: 6px; border-bottom: 1px solid var(--color-border); }
    .detail-item { margin-bottom: var(--space-2); }
    .detail-item strong { font-size: 0.78rem; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 2px; }
    .detail-item span { font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="page-wrapper">

    <nav class="nav">
      <div class="nav__inner">
        <a href="/" class="nav__brand">
          <span>NQU</span> <span class="nav__brand-accent" data-i18n="nav.brand">Job Fair</span>
        </a>
        <ul class="nav__links">
          <li><a href="/" class="nav__link" data-i18n="nav.home">Home</a></li>
          <li><a href="/employer/dashboard.html" class="nav__link nav__link--active" data-i18n="nav.dashboard">Dashboard</a></li>
          <li><a href="#" class="nav__link" onclick="App.logout(); return false;" data-i18n="nav.logout">Logout</a></li>
          <li id="langToggle"></li>
        </ul>
        <button class="nav__hamburger" aria-label="Toggle menu" aria-expanded="false">
          <span class="nav__hamburger__line"></span>
          <span class="nav__hamburger__line"></span>
          <span class="nav__hamburger__line"></span>
        </button>
      </div>
    </nav>
    <div class="nav__overlay"></div>

    <div class="page-content">
      <div class="container" style="padding-top:var(--space-8); padding-bottom:var(--space-16);">

        <!-- Header -->
        <div class="dashboard__header fade-in-up" style="margin-bottom:var(--space-5);">
          <div>
            <h1 class="dashboard__title" data-i18n="empDash.title">Dashboard</h1>
            <p class="text-muted text-sm mt-2" id="welcomeMsg">Welcome back!</p>
          </div>
          <div style="display:flex; gap:var(--space-2); flex-wrap:wrap;">
            <button class="btn btn--outline btn--sm" onclick="App.showModal('accountModal')">⚙ <span data-i18n="empDash.accountBtn">Account</span></button>
            <a href="/employer/submit.html" class="btn btn--primary" id="newSubBtn" data-i18n="empDash.newSub">+ New Submission</a>
          </div>
        </div>

        <!-- Announcements -->
        <div id="announcementsArea" style="margin-bottom:var(--space-5);"></div>

        <!-- Main grid -->
        <div class="dash-grid">

          <!-- Left sidebar -->
          <div>
            <!-- Event Info -->
            <div class="info-card fade-in-up stagger-1">
              <div class="info-card__title">📅 <span data-i18n="empDash.eventInfo">Event Information</span></div>
              <div id="eventInfoBody">
                <div class="loading-skeleton" style="height:12px; width:65%; margin-bottom:8px;"></div>
                <div class="loading-skeleton" style="height:12px; width:80%; margin-bottom:8px;"></div>
                <div class="loading-skeleton" style="height:12px; width:50%;"></div>
              </div>
            </div>

            <!-- Account -->
            <div class="info-card fade-in-up stagger-2" style="margin-top:var(--space-4);">
              <div class="info-card__title">🏢 <span data-i18n="empDash.yourAccount">Your Account</span></div>
              <div id="accountInfoBody">
                <div class="loading-skeleton" style="height:12px; width:70%; margin-bottom:8px;"></div>
                <div class="loading-skeleton" style="height:12px; width:45%;"></div>
              </div>
            </div>
          </div>

          <!-- Right: Submission -->
          <div id="submissionArea" class="fade-in-up stagger-2">
            <div class="card">
              <div class="loading-skeleton" style="height:18px; width:45%; margin-bottom:14px;"></div>
              <div class="loading-skeleton" style="height:12px; width:75%; margin-bottom:8px;"></div>
              <div class="loading-skeleton" style="height:12px; width:60%; margin-bottom:8px;"></div>
              <div class="loading-skeleton" style="height:12px; width:80%; margin-bottom:20px;"></div>
              <div style="display:flex; gap:10px;">
                <div class="loading-skeleton" style="height:34px; width:100px; border-radius:8px;"></div>
                <div class="loading-skeleton" style="height:34px; width:80px; border-radius:8px;"></div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="container">
        <div class="footer__brand">NQU <span class="gold" data-i18n="nav.brand">Job Fair</span></div>
        <p data-i18n="footer.uni">National Quemoy University</p>
      </div>
    </footer>
  </div>

  <!-- ═══ MODAL: Submission Details ═══ -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal" style="max-width:720px; width:95%; max-height:85vh; overflow-y:auto;">
      <div class="modal__header" style="position:sticky; top:0; background:var(--color-bg); z-index:1; border-bottom:1px solid var(--color-border);">
        <h2 class="modal__title" data-i18n="empDash.subDetails">Submission Details</h2>
        <button class="modal__close" onclick="App.hideModal('detailModal')">✕</button>
      </div>
      <div id="detailModalBody" style="padding:var(--space-5);"></div>
    </div>
  </div>

  <!-- ═══ MODAL: Account Settings ═══ -->
  <div class="modal-overlay" id="accountModal">
    <div class="modal" style="max-width:420px;">
      <div class="modal__header">
        <h2 class="modal__title" data-i18n="empDash.accountSettings">Account Settings</h2>
        <button class="modal__close" onclick="App.hideModal('accountModal')">✕</button>
      </div>
      <div id="accountModalInfo" class="text-sm text-muted mb-4" style="padding:0 0 var(--space-3); border-bottom:1px solid var(--color-border); margin-bottom:var(--space-4);"></div>
      <p class="text-sm" style="font-weight:600; margin-bottom:var(--space-3);" data-i18n="empDash.changePw">Change Password</p>
      <div class="form-group">
        <label class="form-label" data-i18n="empDash.currentPw">Current Password</label>
        <input class="form-input" type="password" id="currentPw" placeholder="••••••" autocomplete="current-password">
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="empDash.newPw">New Password</label>
        <input class="form-input" type="password" id="newPw" data-i18n-placeholder="empReg.passwordHint" placeholder="At least 6 characters" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label class="form-label" data-i18n="empDash.confirmNewPw">Confirm New Password</label>
        <input class="form-input" type="password" id="confirmPw" placeholder="••••••" autocomplete="new-password">
      </div>
      <div class="modal__actions">
        <button class="btn btn--outline" onclick="App.hideModal('accountModal')" data-i18n="btn.cancel">Cancel</button>
        <button class="btn btn--primary" onclick="changePassword()" data-i18n="empDash.changePwBtn">Change Password</button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/i18n.js"></script>
  <script>
    let currentUser = null;
    let currentSubmission = null;

    async function init() {
      currentUser = await App.requireAuth('employer');
      if (!currentUser) return;
      I18N.init('langToggle');

      document.getElementById('welcomeMsg').textContent =
        `${I18N.t('empDash.welcome')} ${currentUser.company_name}!`;
      document.getElementById('accountModalInfo').innerHTML =
        `<strong>${App.escapeHtml(currentUser.company_name)}</strong><br>${App.escapeHtml(currentUser.email)}`;
      document.getElementById('accountInfoBody').innerHTML =
        `<div class="info-row"><span class="info-row__icon">🏢</span><span class="info-row__val" style="font-weight:600;">${App.escapeHtml(currentUser.company_name)}</span></div>
         <div class="info-row"><span class="info-row__icon">✉️</span><span class="info-row__val">${App.escapeHtml(currentUser.email)}</span></div>
         <button class="btn btn--outline btn--sm" style="margin-top:var(--space-3); width:100%;" onclick="App.showModal('accountModal')">${I18N.t('empDash.changePwAccount')}</button>`;

      await Promise.all([loadAnnouncements(), loadEventInfo(), loadSubmissions()]);

      // Close modals on overlay click
      ['detailModal','accountModal'].forEach(id => {
        document.getElementById(id).addEventListener('click', function(e) {
          if (e.target === this) App.hideModal(id);
        });
      });
    }

    // ── ANNOUNCEMENTS ─────────────────────────────────────────
    async function loadAnnouncements() {
      try {
        const list = await API.get('/api/announcements');
        const area = document.getElementById('announcementsArea');
        if (!list.length) { area.innerHTML = ''; return; }
        area.innerHTML = list.map(a => `
          <div class="announce-strip ${a.is_pinned ? 'announce-strip--pinned' : 'announce-strip--normal'}">
            <span style="font-size:1.2rem; flex-shrink:0;">${a.is_pinned ? '📌' : '📢'}</span>
            <div>
              <div class="announce-strip__title">${App.escapeHtml(a.title)}</div>
              ${a.content ? `<div>${App.escapeHtml(a.content)}</div>` : ''}
            </div>
          </div>
        `).join('');
      } catch { /* non-critical */ }
    }

    // ── EVENT INFO ────────────────────────────────────────────
    async function loadEventInfo() {
      try {
        const s = await API.get('/api/cms/settings');
        const rows = [
          s.event_date    && ['📅', I18N.t('empDash.eventDate'),     s.event_date],
          s.event_venue   && ['📍', I18N.t('empDash.eventVenue'),    s.event_venue],
          s.registration_deadline && ['⏰', I18N.t('empDash.eventDeadline'), s.registration_deadline],
          s.contact_email && ['✉️', I18N.t('empDash.eventEmail'),    s.contact_email],
          s.contact_phone && ['📞', I18N.t('empDash.eventPhone'),    s.contact_phone],
        ].filter(Boolean);

        document.getElementById('eventInfoBody').innerHTML = rows.length
          ? rows.map(([icon, label, val]) => `
              <div class="info-row">
                <span class="info-row__icon">${icon}</span>
                <div>
                  <div class="info-row__label" style="font-size:0.7rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.3px;">${label}</div>
                  <div class="info-row__val">${App.escapeHtml(val)}</div>
                </div>
              </div>`).join('')
          : `<div class="text-muted text-sm">${I18N.t('empDash.eventComingSoon')}</div>`;
      } catch { /* non-critical */ }
    }

    // ── SUBMISSIONS ───────────────────────────────────────────
    async function loadSubmissions() {
      const area = document.getElementById('submissionArea');
      try {
        const submissions = await API.get('/api/submissions/mine');
        currentSubmission = submissions[0] || null;

        if (!submissions.length) {
          area.innerHTML = `
            <div class="empty-state">
              <div class="empty-state__svg">
                <svg viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg" width="88" height="88">
                  <rect x="16" y="12" width="56" height="64" rx="6" stroke="currentColor" stroke-width="3" fill="none"/>
                  <rect x="28" y="8" width="32" height="10" rx="4" stroke="currentColor" stroke-width="2.5" fill="none"/>
                  <line x1="28" y1="38" x2="60" y2="38" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                  <line x1="28" y1="50" x2="52" y2="50" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                  <line x1="28" y1="62" x2="45" y2="62" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
              </div>
              <div class="empty-state__title">${I18N.t('empDash.noSubs')}</div>
              <div class="empty-state__text" style="max-width:380px; margin:0 auto;">
                ${I18N.t('empDash.noSubsTextFull')}
              </div>
              <a href="/employer/submit.html" class="btn btn--primary" style="margin-top:var(--space-4);">${I18N.t('empDash.createSub')}</a>
            </div>`;
          return;
        }

        area.innerHTML = submissions.map(s => renderSubmissionCard(s)).join('');
      } catch (err) {
        area.innerHTML = `
          <div class="empty-state">
            <div class="empty-state__svg">
              <svg viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg" width="88" height="88">
                <path d="M44 12 L78 72 H10 Z" stroke="currentColor" stroke-width="3" stroke-linejoin="round" fill="none"/>
                <line x1="44" y1="38" x2="44" y2="56" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                <circle cx="44" cy="64" r="2.5" fill="currentColor"/>
              </svg>
            </div>
            <div class="empty-state__title">${I18N.t('empDash.errorLoad')}</div>
            <div class="empty-state__text">${App.escapeHtml(err.message)}</div>
            <button class="btn btn--outline" style="margin-top:var(--space-3);" onclick="loadSubmissions()">${I18N.t('empDash.retry')}</button>
          </div>`;
      }
    }

    function renderSubmissionCard(s) {
      const isPending  = s.status === 'pending';
      const isApproved = s.status === 'approved';
      const isRejected = s.status === 'rejected';

      // Progress steps
      const steps = [
        { label: I18N.t('empDash.stepSubmitted'), done: true,       active: isPending },
        { label: I18N.t('empDash.stepReviewing'), done: isApproved || isRejected, active: isApproved || isRejected, rejected: isRejected && !isApproved },
        { label: isRejected ? I18N.t('empDash.stepRejected') : I18N.t('empDash.stepApproved'), done: isApproved, active: isApproved || isRejected, rejected: isRejected }
      ];

      const progressBar = `
        <div class="progress-bar">
          ${steps.map((step, i) => `
            ${i > 0 ? `<div class="progress-line ${steps[i-1].done && !steps[i-1].rejected ? 'progress-line--done' : ''}"></div>` : ''}
            <div class="progress-step">
              <div class="progress-step__dot ${step.rejected ? 'progress-step__dot--rejected' : step.done && i < steps.length-1 ? 'progress-step__dot--done' : step.done ? 'progress-step__dot--done' : step.active && !step.rejected ? 'progress-step__dot--active' : ''}">
                ${step.rejected ? '✕' : step.done ? '✓' : i + 1}
              </div>
              <div class="progress-step__label ${step.rejected ? 'progress-step__label--rejected' : step.active && !step.rejected && step.done ? 'progress-step__label--active' : ''}">${step.label}</div>
            </div>
          `).join('')}
        </div>`;

      // Booth banner (approved)
      const boothBanner = isApproved && s.booth_number ? `
        <div class="booth-banner">
          <span style="font-size:2rem;">🎪</span>
          <div>
            <div style="font-size:0.75rem; text-transform:uppercase; color:#92400e; letter-spacing:0.5px;">${I18N.t('empDash.assignedBooth')}</div>
            <div class="booth-banner__num">${App.escapeHtml(s.booth_number)}</div>
          </div>
        </div>` : '';

      // Rejection banner
      const rejectBanner = isRejected ? `
        <div class="reject-banner">
          <div class="reject-banner__title">${I18N.t('empDash.rejectTitle')}</div>
          ${s.admin_notes ? `<div class="text-sm" style="margin-top:4px;">${App.escapeHtml(s.admin_notes)}</div>` : ''}
          <div class="text-sm text-muted" style="margin-top:8px;">${I18N.t('empDash.rejectContact')}</div>
        </div>` : '';

      // Admin note (non-rejection)
      const adminNote = !isRejected && s.admin_notes ? `
        <div style="background:var(--color-bg-alt); border-radius:var(--radius-sm); padding:10px 14px; margin-bottom:var(--space-4); font-size:0.875rem;">
          📝 <strong>${I18N.t('empDash.adminNoteLabel')}</strong> ${App.escapeHtml(s.admin_notes)}
        </div>` : '';

      // Key fields
      const fields = [
        [I18N.t('submit.companyName'), s.company_name],
        [I18N.t('submit.activityCategory'), s.activity_category || '—'],
        [I18N.t('submit.industry'), s.industry || '—'],
        [I18N.t('empDash.fieldContact'), s.contact_person || '—'],
        [I18N.t('empDash.eventEmail'), s.contact_email || '—'],
        [I18N.t('submit.attendeeCount'), s.attendee_count != null ? s.attendee_count : '—'],
        [I18N.t('submit.boothSignName'), s.booth_signboard_name || '—'],
        [I18N.t('submit.taxId'), s.tax_id || '—'],
      ].filter(([, v]) => v && v !== '—').slice(0, 6);

      const fieldsHtml = `
        <div class="sub-card__fields">
          ${fields.map(([label, val]) => `
            <div>
              <div class="sub-field__label">${label}</div>
              <div class="sub-field__val">${App.escapeHtml(String(val))}</div>
            </div>`).join('')}
        </div>`;

      // Submitted date
      const submittedOn = `<div class="text-xs text-muted" style="margin-bottom:var(--space-4);">${I18N.t('empDash.submittedOn')} ${App.timeAgo(s.submitted_at)} · ${App.formatDate(s.submitted_at)}</div>`;

      // Actions
      const actions = `
        <div class="sub-card__actions">
          <button class="btn btn--outline btn--sm" onclick="viewDetail(${s.id})">👁 ${I18N.t('empDash.viewDetails')}</button>
          ${isPending ? `<a href="/employer/submit.html?edit=${s.id}" class="btn btn--outline btn--sm">✏️ ${I18N.t('empDash.edit')}</a>` : ''}
          ${isPending ? `<button class="btn btn--ghost btn--sm" style="color:var(--color-danger);" onclick="deleteSubmission(${s.id})">🗑 ${I18N.t('empDash.delete')}</button>` : ''}
          ${isApproved ? `<button class="btn btn--outline btn--sm" onclick="printConfirmation(${s.id})">🖨️ ${I18N.t('empDash.printConfirm')}</button>` : ''}
        </div>`;

      return `
        <div class="sub-card ${isApproved ? 'sub-card--approved' : isRejected ? 'sub-card--rejected' : ''}">
          <div class="sub-card__header">
            ${s.logo_path
              ? `<img src="${s.logo_path}" alt="${App.escapeHtml(s.company_name)}" class="sub-card__logo">`
              : `<div class="sub-card__logo-placeholder">🏢</div>`}
            <div style="flex:1; min-width:0;">
              <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px;">
                <div class="text-lg font-bold" style="font-weight:700;">${App.escapeHtml(s.company_name)}</div>
                ${App.statusBadge(s.status)}
              </div>
              <div class="text-sm text-muted">${App.escapeHtml(s.activity_category || '')}${s.industry ? ' · ' + App.escapeHtml(s.industry) : ''}</div>
            </div>
          </div>
          <div class="sub-card__body">
            ${progressBar}
            ${boothBanner}
            ${rejectBanner}
            ${adminNote}
            ${submittedOn}
            ${fieldsHtml}
            ${actions}
          </div>
        </div>`;
    }

    // ── VIEW FULL DETAILS ─────────────────────────────────────
    async function viewDetail(id) {
      const modal = document.getElementById('detailModalBody');
      modal.innerHTML = '<div style="text-align:center;padding:3rem;"><div class="spinner"></div></div>';
      App.showModal('detailModal');
      try {
        const s = await API.get(`/api/submissions/${id}`);
        const esc = App.escapeHtml;
        const field = (label, val) => val ? `<div class="detail-item"><strong>${label}</strong><span>${esc(String(val))}</span></div>` : '';
        const yesno = v => v === 'Yes' ? '✓ Yes' : v === 'No' ? '✕ No' : v || '—';

        modal.innerHTML = `
          ${s.logo_path ? `<div style="text-align:center; margin-bottom:var(--space-4);"><img src="${s.logo_path}" style="max-height:80px; max-width:200px; object-fit:contain; border-radius:var(--radius-md); border:1px solid var(--color-border);"></div>` : ''}

          <div class="detail-section">
            <div class="detail-section__title">${I18N.t('empDash.detailCompany')}</div>
            <div class="detail-grid">
              ${field(I18N.t('submit.companyName'), s.company_name)}
              ${field(I18N.t('submit.boothSignName'), s.booth_signboard_name)}
              ${field(I18N.t('empDash.detailCeo'), s.ceo_name)}
              ${field(I18N.t('submit.taxId'), s.tax_id)}
              ${field(I18N.t('submit.industry'), s.industry)}
              ${field(I18N.t('empDash.mainProducts'), s.main_products)}
              ${field(I18N.t('empDash.estDate'), s.establishment_date)}
              ${field(I18N.t('empDash.groupType'), s.group_type)}
            </div>
          </div>

          <div class="detail-section">
            <div class="detail-section__title">${I18N.t('empDash.detailContact')}</div>
            <div class="detail-grid">
              ${field(I18N.t('empDash.detailContactPerson'), s.contact_person)}
              ${field(I18N.t('empDash.eventEmail'), s.contact_email)}
              ${field(I18N.t('empDash.phone'), s.contact_phone)}
              ${field(I18N.t('submit.mailingAddress'), s.mailing_address)}
            </div>
          </div>

          <div class="detail-section">
            <div class="detail-section__title">${I18N.t('empDash.detailRegDetails')}</div>
            <div class="detail-grid">
              ${field(I18N.t('submit.activityCategory'), s.activity_category)}
              ${field(I18N.t('submit.prevPartic'), yesno(s.is_previous_participant))}
              ${field(I18N.t('submit.internship'), s.internship_cooperation)}
              ${field(I18N.t('submit.targetDepts'), s.target_departments)}
            </div>
          </div>

          <div class="detail-section">
            <div class="detail-section__title">${I18N.t('empDash.detailRecruitment')}</div>
            ${field(I18N.t('empDash.companyIntro'), s.company_intro)}
            ${field(I18N.t('submit.jobPositions'), s.job_positions)}
            ${field(I18N.t('empDash.requirements'), s.requirements)}
            ${field(I18N.t('empDash.benefits'), s.benefits)}
          </div>

          <div class="detail-section">
            <div class="detail-section__title">${I18N.t('empDash.detailLogistics')}</div>
            <div class="detail-grid">
              ${field(I18N.t('empDash.leadAttendee'), s.attendee_main)}
              ${field(I18N.t('submit.attendeeCount'), s.attendee_count)}
              ${field(I18N.t('submit.lunchNonVeg'), s.lunch_box_non_veg)}
              ${field(I18N.t('submit.lunchVeg'), s.lunch_box_veg)}
              ${field(I18N.t('submit.parking'), s.parking_spaces)}
              ${field(I18N.t('empDash.presentationRoom'), yesno(s.has_presentation_need))}
              ${field(I18N.t('empDash.shuttle'), yesno(s.has_shuttle_need))}
              ${s.shuttle_details ? field(I18N.t('empDash.shuttleDetails'), s.shuttle_details) : ''}
              ${field(I18N.t('submit.rafflePrizes'), s.raffle_prizes)}
              ${field(I18N.t('submit.otherReq'), s.other_requirements)}
            </div>
          </div>

          <div class="detail-section">
            <div class="detail-section__title">${I18N.t('adm.status')}</div>
            <div class="detail-grid">
              ${field(I18N.t('adm.status'), s.status?.toUpperCase())}
              ${field(I18N.t('empDash.boothNumber'), s.booth_number)}
              ${field(I18N.t('empDash.adminNote'), s.admin_notes)}
              ${field(I18N.t('empDash.submittedOn'), App.formatDate(s.submitted_at))}
              ${s.reviewed_at ? field(I18N.t('empDash.reviewedOn'), App.formatDate(s.reviewed_at)) : ''}
            </div>
          </div>`;
      } catch (err) {
        modal.innerHTML = `<div class="text-danger" style="padding:2rem;">${App.escapeHtml(err.message)}</div>`;
      }
    }

    // ── PRINT CONFIRMATION ────────────────────────────────────
    async function printConfirmation(id) {
      let s;
      try {
        s = await API.get(`/api/submissions/${id}`);
      } catch (err) { App.toast(err.message, 'error'); return; }

      const isZh = I18N.currentLang === 'zh';
      const html = `<!DOCTYPE html><html><head><meta charset="UTF-8">
        <title>${I18N.t('empDash.printTitle')}</title>
        <style>
          body { font-family: Arial, sans-serif; font-size: 12px; color: #111; padding: 32px; max-width: 680px; margin: 0 auto; }
          h1 { font-size: 22px; margin-bottom: 4px; }
          h2 { font-size: 14px; margin: 20px 0 8px; border-bottom: 1px solid #ccc; padding-bottom: 4px; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }
          .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 24px; }
          .field strong { display: block; font-size: 10px; color: #888; text-transform: uppercase; margin-bottom: 1px; }
          .booth-box { background: #fef3c7; border: 2px solid #f59e0b; border-radius: 8px; padding: 16px 24px; margin: 16px 0; display: inline-block; }
          .booth-box .num { font-size: 36px; font-weight: 900; color: #92400e; }
          .footer { margin-top: 40px; padding-top: 12px; border-top: 1px solid #ccc; font-size: 11px; color: #888; }
          @media print { body { padding: 0; } }
        </style></head><body>
        <h1>${I18N.t('empDash.printTitle')}</h1>
        <p style="color:#555; margin-bottom:20px;">${I18N.t('empDash.printSubtitle')}</p>
        ${s.booth_number ? `<div class="booth-box"><div style="font-size:11px;color:#92400e;text-transform:uppercase;letter-spacing:1px;">${I18N.t('empDash.printBoothLabel')}</div><div class="num">${s.booth_number}</div></div>` : ''}
        <h2>${I18N.t('empDash.detailCompany')}</h2>
        <div class="grid">
          <div class="field"><strong>${I18N.t('submit.companyName')}</strong>${s.company_name || '—'}</div>
          <div class="field"><strong>${I18N.t('submit.boothSignName')}</strong>${s.booth_signboard_name || '—'}</div>
          <div class="field"><strong>${I18N.t('empDash.detailContactPerson')}</strong>${s.contact_person || '—'}</div>
          <div class="field"><strong>${I18N.t('empDash.eventEmail')}</strong>${s.contact_email || '—'}</div>
          <div class="field"><strong>${I18N.t('empDash.phone')}</strong>${s.contact_phone || '—'}</div>
          <div class="field"><strong>${I18N.t('submit.industry')}</strong>${s.industry || '—'}</div>
          <div class="field"><strong>${I18N.t('submit.taxId')}</strong>${s.tax_id || '—'}</div>
          <div class="field"><strong>${I18N.t('submit.activityCategory')}</strong>${s.activity_category || '—'}</div>
        </div>
        <h2>${I18N.t('empDash.detailLogistics')}</h2>
        <div class="grid">
          <div class="field"><strong>${I18N.t('empDash.leadAttendee')}</strong>${s.attendee_main || '—'}</div>
          <div class="field"><strong>${I18N.t('submit.attendeeCount')}</strong>${s.attendee_count ?? '—'}</div>
          <div class="field"><strong>${I18N.t('submit.lunchNonVeg')}</strong>${s.lunch_box_non_veg ?? 0}</div>
          <div class="field"><strong>${I18N.t('submit.lunchVeg')}</strong>${s.lunch_box_veg ?? 0}</div>
          <div class="field"><strong>${I18N.t('submit.parking')}</strong>${s.parking_spaces ?? 0}</div>
          <div class="field"><strong>${I18N.t('empDash.presentationRoom')}</strong>${s.has_presentation_need || '—'}</div>
          <div class="field"><strong>${I18N.t('empDash.shuttle')}</strong>${s.has_shuttle_need || '—'}</div>
          <div class="field"><strong>${I18N.t('adm.status')}</strong>${I18N.t('empDash.printApproved')}</div>
        </div>
        ${s.admin_notes ? `<h2>${I18N.t('empDash.printNotes')}</h2><p>${s.admin_notes}</p>` : ''}
        <div class="footer">
          ${isZh ? `列印日期：${new Date().toLocaleDateString('zh-TW', {year:'numeric',month:'long',day:'numeric'})}` : `Printed on ${new Date().toLocaleDateString('en-US', {year:'numeric',month:'long',day:'numeric'})}`} ·
          NQU Job Fair System · National Quemoy University
        </div>
      </body></html>`;

      const win = window.open('', '_blank');
      win.document.write(html);
      win.document.close();
      win.onload = () => { win.focus(); win.print(); };
    }

    // ── DELETE ────────────────────────────────────────────────
    async function deleteSubmission(id) {
      if (!App.confirm(I18N.t('adm.confirmDelSub'))) return;
      try {
        await API.delete(`/api/submissions/${id}`);
        App.toast(I18N.t('msg.subDeleted'), 'success');
        document.getElementById('newSubBtn').style.display = '';
        loadSubmissions();
      } catch (err) { App.toast(err.message, 'error'); }
    }

    // ── CHANGE PASSWORD ───────────────────────────────────────
    async function changePassword() {
      const current = document.getElementById('currentPw').value;
      const next    = document.getElementById('newPw').value;
      const confirm = document.getElementById('confirmPw').value;

      if (!current || !next) { App.toast(I18N.t('empDash.allFieldsRequired'), 'error'); return; }
      if (next.length < 6) { App.toast(I18N.t('err.pwTooShort'), 'error'); return; }
      if (next !== confirm) { App.toast(I18N.t('empReg.mismatch'), 'error'); return; }

      try {
        await API.patch('/api/auth/employer/change-password', {
          current_password: current,
          new_password: next
        });
        App.toast(I18N.t('empDash.pwChanged'), 'success');
        App.hideModal('accountModal');
        document.getElementById('currentPw').value = '';
        document.getElementById('newPw').value = '';
        document.getElementById('confirmPw').value = '';
      } catch (err) { App.toast(err.message, 'error'); }
    }

    // Re-render JS-generated content when language switches
    document.addEventListener('langchange', () => {
      if (!currentUser) return;
      document.getElementById('welcomeMsg').textContent =
        `${I18N.t('empDash.welcome')} ${currentUser.company_name}!`;
      document.getElementById('accountInfoBody').innerHTML =
        `<div class="info-row"><span class="info-row__icon">🏢</span><span class="info-row__val" style="font-weight:600;">${App.escapeHtml(currentUser.company_name)}</span></div>
         <div class="info-row"><span class="info-row__icon">✉️</span><span class="info-row__val">${App.escapeHtml(currentUser.email)}</span></div>
         <button class="btn btn--outline btn--sm" style="margin-top:var(--space-3); width:100%;" onclick="App.showModal('accountModal')">${I18N.t('empDash.changePwAccount')}</button>`;
      loadEventInfo();
      loadSubmissions();
    });

    init();
  </script>
</body>
</html>
