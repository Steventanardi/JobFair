<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="description" content="企業登入 — NQU 就業博覽會">
  <title>企業登入 — NQU Job Fair</title>
  <link rel="stylesheet" href="/css/style.css">
  <script>if(localStorage.getItem('nqu-dark')==='1')document.documentElement.setAttribute('data-theme','dark')</script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-card fade-in-up">
      <div class="auth-card__logo">
        <a href="/" class="auth-card__logo-text" style="text-decoration:none; display:block; color:inherit;">
          NQU <span class="auth-card__logo-accent" data-i18n="nav.brand">Job Fair</span>
        </a>
        <div style="margin-top:var(--space-3);" id="langToggle"></div>
      </div>

      <h1 class="auth-card__title" data-i18n="empLogin.title">企業登入</h1>
      <p class="auth-card__subtitle" data-i18n="empLogin.subtitle">請輸入公司統一編號以登入或自動完成註冊</p>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="unified_business_no" data-i18n="empLogin.ubn">
            公司統一編號 (Unified Business Number)
          </label>
          <input
            class="form-input"
            type="text"
            id="unified_business_no"
            name="unified_business_no"
            placeholder="請輸入統一編號，例如：12345678"
            maxlength="8"
            pattern="\d{8}"
            inputmode="numeric"
            required
            autocomplete="off"
            style="font-size:1.25rem; letter-spacing:0.15em; text-align:center;"
          >
        </div>

        <p class="text-sm" style="color:var(--color-text-muted); margin-top:var(--space-2); margin-bottom:var(--space-4); text-align:center;" data-i18n="empLogin.ubnNote">
          無需密碼。若為新公司請直接輸入統一編號完成註冊。
        </p>

        <div id="errorMsg" class="form-error mb-4" style="display:none;"></div>

        <button type="submit" class="btn btn--primary btn--full btn--lg" id="submitBtn" data-i18n="empLogin.submit">
          登入 / 進入系統
        </button>
      </form>

      <div style="text-align:center; margin-top:var(--space-4); padding-top:var(--space-3); border-top:1px solid var(--color-border);">
        <p class="text-xs" style="color:var(--color-text-muted);">
          <a href="/" style="font-weight:600;" data-i18n="empLogin.backHome">← 返回活動頁面</a>
        </p>
      </div>

      <div style="text-align:center; margin-top:var(--space-3); padding-top:var(--space-3); border-top:1px solid var(--color-border);">
        <p class="text-xs" style="color:var(--color-text-muted);">Are you an admin?
          <a href="/admin/login.html" style="font-weight:600;">Admin login →</a>
        </p>
      </div>

    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/i18n.js"></script>
  <script>
    I18N.init('langToggle');

    const form = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');
    const submitBtn = document.getElementById('submitBtn');
    const ubnInput = document.getElementById('unified_business_no');

    // Allow only digits
    ubnInput.addEventListener('input', () => {
      ubnInput.value = ubnInput.value.replace(/\D/g, '').slice(0, 8);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';

      const ubn = ubnInput.value.trim();
      if (!/^\d{8}$/.test(ubn)) {
        errorMsg.textContent = I18N.t('empLogin.ubnError');
        errorMsg.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = I18N.t('empLogin.submitting');

      try {
        await API.post('/api/auth/employer/login', { unified_business_no: ubn });
        App.toast(I18N.t('msg.loginSuccess'), 'success');
        setTimeout(() => window.location.href = '/employer/dashboard.html', 500);
      } catch (err) {
        errorMsg.textContent = err.message;
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = I18N.t('empLogin.submit');
      }
    });

    API.checkAuth().then(user => {
      if (user && user.role === 'employer') window.location.href = '/employer/dashboard.html';
    });
  </script>
</body>
</html>
